<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andon Support — SME Console</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Amazon Ember", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #12151b; color: #e8edf2; height: 100vh; display: flex; flex-direction: column;
  }

  /* LOGIN GATE */
  .gate { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .gate .box { width: 100%; max-width: 420px; background: #1b1f27; border: 1px solid #2a2f3a; border-radius: 12px; padding: 26px; }
  .gate h1 { font-size: 18px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
  .gate p { font-size: 13px; color: #8a94a3; margin-bottom: 18px; }
  label { display: block; font-size: 12px; color: #9aa4b2; margin-bottom: 6px; }
  input[type=text], textarea {
    width: 100%; padding: 11px 12px; background: #12151b; border: 1px solid #2f3542;
    border-radius: 8px; color: #e8edf2; font-size: 14px; outline: none;
  }
  input:focus, textarea:focus { border-color: #4aa3ff; }
  .btn { border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 700; }
  .btn-primary { background: #4aa3ff; color: #06121f; padding: 12px; width: 100%; margin-top: 16px; }
  .btn-primary:hover { background: #2f90f5; }

  /* APP */
  .app { flex: 1; display: none; flex-direction: column; overflow: hidden; }
  .app.show { display: flex; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px; background: #1b1f27; border-bottom: 1px solid #2a2f3a;
  }
  .topbar h1 { font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .topbar .right { display: flex; align-items: center; gap: 14px; font-size: 12px; color: #8a94a3; }
  .topbar .who { color: #4aa3ff; font-weight: 700; }
  .topbar a { color: #8a94a3; text-decoration: none; border: 1px solid #2f3542; padding: 5px 10px; border-radius: 6px; }
  .topbar a:hover { border-color: #4aa3ff; color: #4aa3ff; }

  .main { flex: 1; display: flex; overflow: hidden; }
  .queue { width: 340px; border-right: 1px solid #2a2f3a; display: flex; flex-direction: column; }
  .queue-head { padding: 12px 16px; font-weight: 700; font-size: 13px; border-bottom: 1px solid #2a2f3a; display: flex; justify-content: space-between; align-items: center; }
  .queue-head .count { background: #f0932b; color: #1a1207; border-radius: 10px; font-size: 11px; padding: 1px 9px; font-weight: 700; }
  .queue-list { flex: 1; overflow-y: auto; }
  .queue-empty { color: #6b7480; font-size: 12px; padding: 20px; text-align: center; }
  .q-item { padding: 12px 16px; border-bottom: 1px solid #23272f; cursor: pointer; }
  .q-item:hover { background: #1b1f27; }
  .q-item.active { background: #14283c; box-shadow: inset 3px 0 0 #4aa3ff; }
  .q-item .q-top { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .q-item .assoc { font-size: 13px; font-weight: 700; color: #e8edf2; }
  .q-item .time { font-size: 10px; color: #6b7480; }
  .q-item .snippet { font-size: 12px; color: #9aa4b2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .q-item .badge { font-size: 9px; padding: 1px 7px; border-radius: 8px; font-weight: 700; margin-left: 6px; }
  .badge.open { background: rgba(240,147,43,0.2); color: #f0932b; }
  .badge.answered { background: rgba(76,175,80,0.2); color: #66bb6a; }
  .badge.resolved { background: rgba(120,130,140,0.2); color: #9aa4b2; }

  .detail { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .detail-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #6b7480; }
  .detail-empty .ic { font-size: 42px; opacity: 0.5; margin-bottom: 12px; }
  .detail-active { flex: 1; display: none; flex-direction: column; overflow: hidden; }
  .detail-active.show { display: flex; }
  .detail-body { flex: 1; overflow-y: auto; padding: 20px; }
  .meta { display: flex; gap: 18px; margin-bottom: 14px; font-size: 13px; }
  .meta .k { color: #6b7480; font-size: 11px; }
  .qcomment { background: #1b1f27; border: 1px solid #2a2f3a; border-radius: 8px; padding: 14px; font-size: 14px; line-height: 1.5; margin-bottom: 16px; }
  .qimage { text-align: center; margin-bottom: 16px; }
  .qimage img { max-width: 100%; border-radius: 8px; border: 1px solid #2a2f3a; cursor: zoom-in; }
  .qimage .noimg { color: #6b7480; font-size: 12px; }
  .thread { margin-bottom: 16px; }
  .ans { background: rgba(74,163,255,0.08); border: 1px solid rgba(74,163,255,0.25); border-radius: 8px; padding: 12px; margin-bottom: 8px; }
  .ans .who { font-size: 11px; color: #4aa3ff; font-weight: 700; margin-bottom: 3px; }
  .ans .txt { font-size: 14px; line-height: 1.5; }
  .ans .ts { font-size: 10px; color: #6b7480; margin-top: 5px; }

  .reply { border-top: 1px solid #2a2f3a; padding: 14px 20px; }
  .reply textarea { min-height: 60px; resize: vertical; }
  .reply-actions { display: flex; gap: 10px; margin-top: 10px; }
  .btn-send { background: #4aa3ff; color: #06121f; padding: 10px 18px; }
  .btn-send:hover { background: #2f90f5; }
  .btn-resolve { background: #43a047; color: #fff; padding: 10px 18px; }
  .btn-resolve:hover { background: #388e3c; }
  .btn-release { background: transparent; color: #c5ccd6; border: 1px solid #3a3f49; padding: 10px 18px; }
  .btn-release:hover { border-color: #f0932b; color: #f0932b; }
  .btn-claim { background: #f0932b; color: #1a1207; padding: 10px 18px; }
  .btn-claim:hover { background: #e0850f; }

  .claim-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; background: #14283c; border: 1px solid #24455f; border-radius: 8px; margin-bottom: 4px; }
  .claim-msg { font-size: 13px; color: #c5ccd6; }
  .claim-msg.locked { color: #f0932b; }
  #replyForm.locked { opacity: 0.5; pointer-events: none; }

  /* queue claim notes */
  .claim-note { font-size: 11px; margin-top: 5px; }
  .claim-note.mine { color: #66bb6a; }
  .claim-note.other { color: #f0932b; }
  .status.badge.claimed, .badge.claimed { background: rgba(74,163,255,0.2); color: #4aa3ff; }

  .toast { position: fixed; top: 18px; left: 50%; transform: translate(-50%,-120%); background: #4aa3ff; color: #06121f; padding: 10px 18px; border-radius: 6px; font-size: 13px; z-index: 999; transition: transform .3s; font-weight: 700; }
  .toast.show { transform: translate(-50%,0); }
</style>
</head>
<body>

  <!-- LOGIN GATE -->
  <div class="gate" id="gate">
    <div class="box">
      <h1>&#128736; Andon SME Console</h1>
      <p>Sign in to receive and answer live associate queries.</p>
      <label for="login">Your SME login / alias</label>
      <input type="text" id="login" placeholder="e.g. expert_jane" autocomplete="off" autofocus
             onkeydown="if(event.key==='Enter')doLogin()">
      <button class="btn btn-primary" onclick="doLogin()">Go online</button>
    </div>
  </div>

  <!-- APP -->
  <div class="app" id="app">
    <div class="topbar">
      <h1>&#128736; Andon SME Console</h1>
      <div class="right">
        <span>Signed in as <span class="who" id="whoami"></span></span>
        <a href="dashboard.html" target="_blank">Dashboard</a>
        <a href="#" onclick="andonLogout();return false;">Log out</a>
      </div>
    </div>
    <div class="main">
      <div class="queue">
        <div class="queue-head"><span>Incoming Queries</span><span class="count" id="openCount">0</span></div>
        <div class="queue-list" id="queueList"><div class="queue-empty">No queries yet.</div></div>
      </div>
      <div class="detail">
        <div class="detail-empty" id="detailEmpty">
          <div class="ic">&#128172;</div>
          <div>Select a query to view and respond.</div>
        </div>
        <div class="detail-active" id="detailActive">
          <div class="detail-body">
            <div class="meta">
              <div><div class="k">Associate</div><div id="dAssoc"></div></div>
              <div><div class="k">Query ID</div><div id="dId"></div></div>
              <div><div class="k">Status</div><div id="dStatus"></div></div>
              <div><div class="k">Received</div><div id="dTime"></div></div>
            </div>
            <div class="qcomment" id="dComment"></div>
            <div class="qimage" id="dImage"></div>
            <div class="thread" id="dThread"></div>
          </div>
          <div class="reply">
            <!-- Claim bar: shown when the query is unclaimed or claimed by someone else -->
            <div class="claim-bar" id="claimBar">
              <span class="claim-msg" id="claimMsg"></span>
              <button class="btn btn-claim" id="btnClaim" onclick="claimQuery()">Claim query</button>
            </div>

            <!-- Reply form: only usable by the SME who claimed it -->
            <div id="replyForm">
              <label>Your response</label>
              <textarea id="replyText" placeholder="Type guidance for the associate..."
                        onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();sendReply();}"></textarea>
              <div class="reply-actions">
                <button class="btn btn-send" onclick="sendReply()">Send response</button>
                <button class="btn btn-resolve" onclick="resolveQuery()">Mark resolved</button>
                <button class="btn btn-release" onclick="releaseQuery()">Release</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
let smeLogin = '';
let activeId = null;
let queriesCache = {};
let pollTimer = null;

async function andonLogout() {
  try { await fetch('/api/logout', { method: 'POST' }); } catch (e) {}
  location.href = '/login.html';
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(iso){ try { return new Date(iso).toLocaleString(); } catch(e){ return iso; } }

function doLogin() {
  const v = document.getElementById('login').value.trim();
  if (!v) { toast('Enter your login.'); return; }
  smeLogin = v;
  document.getElementById('whoami').textContent = v;
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').classList.add('show');
  startPolling();
}

function startPolling() {
  stopPolling();
  pollTimer = setInterval(refresh, 2000);
  refresh();
}
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

async function refresh() {
  try {
    // show open + answered (not resolved) in the queue so SMEs can follow up
    const res = await fetch('/api/queries');
    const data = await res.json();
    const all = (data.queries || []).filter(q => q.status !== 'resolved');
    queriesCache = {};
    all.forEach(q => queriesCache[q.id] = q);
    renderQueue(all);
    if (activeId && queriesCache[activeId]) renderDetail(queriesCache[activeId]);
  } catch (e) { /* keep polling */ }
}

function renderQueue(list) {
  const openCount = list.filter(q => q.status === 'open').length;
  document.getElementById('openCount').textContent = openCount;
  const el = document.getElementById('queueList');
  if (!list.length) { el.innerHTML = '<div class="queue-empty">No open queries right now.</div>'; return; }
  el.innerHTML = list.map(q => {
    const mine = q.claimed_by && q.claimed_by === smeLogin;
    const claimedNote = q.claimed_by
      ? '<div class="claim-note ' + (mine ? 'mine' : 'other') + '">' +
          (mine ? '\u2713 Claimed by you' : '\uD83D\uDD12 Claimed by ' + escapeHtml(q.claimed_by)) +
        '</div>'
      : '';
    return '<div class="q-item ' + (q.id === activeId ? 'active' : '') + '" onclick="openQuery(' + q.id + ')">' +
      '<div class="q-top"><span class="assoc">' + escapeHtml(q.associate_login) +
        '<span class="badge ' + q.status + '">' + q.status.toUpperCase() + '</span></span>' +
        '<span class="time">' + fmt(q.created_at) + '</span></div>' +
      '<div class="snippet">' + escapeHtml(q.comment) + '</div>' +
      claimedNote +
    '</div>';
  }).join('');
}

function openQuery(id) {
  activeId = id;
  document.getElementById('detailEmpty').style.display = 'none';
  document.getElementById('detailActive').classList.add('show');
  renderDetail(queriesCache[id]);
  renderQueue(Object.values(queriesCache).filter(q => q.status !== 'resolved'));
}

function renderDetail(q) {
  if (!q) return;
  document.getElementById('dAssoc').textContent = q.associate_login;
  document.getElementById('dId').textContent = '#' + q.id;
  document.getElementById('dStatus').textContent = q.status;
  document.getElementById('dTime').textContent = fmt(q.created_at);
  document.getElementById('dComment').textContent = q.comment;
  const imgEl = document.getElementById('dImage');
  imgEl.innerHTML = q.image
    ? '<img src="' + q.image + '" onclick="window.open(this.src)">'
    : '<div class="noimg">No screenshot attached.</div>';
  const thread = q.answers || [];
  document.getElementById('dThread').innerHTML = thread.map(a =>
    '<div class="ans"><div class="who">' + escapeHtml(a.sme_login) + ' (SME)</div>' +
    '<div class="txt">' + escapeHtml(a.response_text) + '</div>' +
    '<div class="ts">' + fmt(a.created_at) + '</div></div>'
  ).join('');

  // ---- claim state ----
  const claimBar = document.getElementById('claimBar');
  const claimMsg = document.getElementById('claimMsg');
  const btnClaim = document.getElementById('btnClaim');
  const replyForm = document.getElementById('replyForm');
  const mine = q.claimed_by && q.claimed_by === smeLogin;

  if (!q.claimed_by) {
    // Unclaimed: show claim bar with a Claim button, hide reply form.
    claimBar.style.display = 'flex';
    claimMsg.className = 'claim-msg';
    claimMsg.textContent = 'This query is unclaimed. Claim it to respond.';
    btnClaim.style.display = 'inline-block';
    replyForm.style.display = 'none';
  } else if (mine) {
    // Claimed by me: hide claim bar, show reply form.
    claimBar.style.display = 'none';
    replyForm.style.display = 'block';
    replyForm.classList.remove('locked');
  } else {
    // Claimed by someone else: locked.
    claimBar.style.display = 'flex';
    claimMsg.className = 'claim-msg locked';
    claimMsg.textContent = '\uD83D\uDD12 Claimed by ' + q.claimed_by + ' — you cannot respond.';
    btnClaim.style.display = 'none';
    replyForm.style.display = 'none';
  }
}

async function claimQuery() {
  if (!activeId) return;
  try {
    const res = await fetch('/api/claim', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query_id: activeId, sme_login: smeLogin })
    });
    const data = await res.json();
    if (res.status === 409) {
      toast('Already claimed by ' + (data.claimed_by || 'another SME') + '.');
      await refresh();
      return;
    }
    if (!res.ok) throw new Error(data.error || 'Failed to claim');
    toast('Query claimed. You can respond now.');
    await refresh();
  } catch (err) { toast(err.message); }
}

async function releaseQuery() {
  if (!activeId) return;
  try {
    const res = await fetch('/api/release', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query_id: activeId, sme_login: smeLogin })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to release');
    toast('Released. Others can now claim it.');
    await refresh();
  } catch (err) { toast(err.message); }
}

async function sendReply() {
  if (!activeId) return;
  const text = document.getElementById('replyText').value.trim();
  if (!text) { toast('Type a response first.'); return; }
  try {
    const res = await fetch('/api/answers', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query_id: activeId, sme_login: smeLogin, response_text: text })
    });
    const data = await res.json();
    if (res.status === 409 && data.error === 'must_claim_first') {
      toast('Claim the query before responding.'); await refresh(); return;
    }
    if (res.status === 403 && data.error === 'claimed_by_other') {
      toast('Claimed by ' + (data.claimed_by || 'another SME') + '.'); await refresh(); return;
    }
    if (!res.ok) throw new Error(data.error || 'Failed');
    document.getElementById('replyText').value = '';
    toast('Response sent.');
    refresh();
  } catch (err) { toast(err.message); }
}

async function resolveQuery() {
  if (!activeId) return;
  await fetch('/api/resolve', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ query_id: activeId })
  });
  toast('Marked resolved.');
  activeId = null;
  document.getElementById('detailActive').classList.remove('show');
  document.getElementById('detailEmpty').style.display = 'flex';
  refresh();
}
</script>
</body>
</html>
