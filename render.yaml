# Render Blueprint — one-click provisioning of the web service + free Postgres.
# You can either use this file (New + > Blueprint) or set things up manually
# following DEPLOY-RENDER.md. Both achieve the same result.
services:
  - type: web
    name: andon-support
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server.py"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: andon-db
          property: connectionString

databases:
  - name: andon-db
    plan: free
