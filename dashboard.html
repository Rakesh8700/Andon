<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andon Support — Tracking Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Amazon Ember", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #0f1218; color: #e8edf2; padding: 24px; min-height: 100vh;
  }
  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; flex-wrap: wrap; gap: 12px; }
  .head h1 { font-size: 20px; display: flex; align-items: center; gap: 10px; }
  .head .actions { display: flex; gap: 10px; }
  .btn { border: 1px solid #2f3542; background: #1b1f27; color: #c5ccd6; border-radius: 7px; padding: 8px 14px; cursor: pointer; font-size: 13px; text-decoration: none; }
  .btn:hover { border-color: #4aa3ff; color: #4aa3ff; }
  .btn.primary { background: #4aa3ff; color: #06121f; border-color: #4aa3ff; font-weight: 700; }

  .totals { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .stat { background: #1b1f27; border: 1px solid #2a2f3a; border-radius: 10px; padding: 18px 22px; min-width: 160px; flex: 1; }
  .stat .n { font-size: 30px; font-weight: 700; }
  .stat .l { font-size: 12px; color: #8a94a3; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat.blue .n { color: #4aa3ff; }
  .stat.green .n { color: #66bb6a; }
  .stat.orange .n { color: #f0932b; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: #1b1f27; border: 1px solid #2a2f3a; border-radius: 10px; overflow: hidden; }
  .panel h2 { font-size: 14px; padding: 14px 18px; border-bottom: 1px solid #2a2f3a; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 18px; font-size: 13px; border-bottom: 1px solid #23272f; }
  th { color: #8a94a3; font-weight: 700; font-size: 12px; }
  tbody tr:hover { background: #20252e; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 700; }
  .pill.open { background: rgba(240,147,43,0.2); color: #f0932b; }
  .pill.claimed { background: rgba(74,163,255,0.2); color: #4aa3ff; }
  .pill.answered { background: rgba(76,175,80,0.2); color: #66bb6a; }
  .pill.resolved { background: rgba(120,130,140,0.2); color: #9aa4b2; }
  .empty { padding: 18px; color: #6b7480; font-size: 13px; text-align: center; }

  .history { background: #1b1f27; border: 1px solid #2a2f3a; border-radius: 10px; overflow: hidden; }
  .history h2 { font-size: 14px; padding: 14px 18px; border-bottom: 1px solid #2a2f3a; display: flex; justify-content: space-between; align-items: center; }
  .history-wrap { overflow-x: auto; }
  .answers-cell { color: #9aa4b2; font-size: 12px; }
  .answers-cell b { color: #4aa3ff; }
  .muted { color: #6b7480; font-size: 11px; }
  .img-link { color: #4aa3ff; text-decoration: none; font-size: 12px; }
  .img-link:hover { text-decoration: underline; }
  .updated { font-size: 11px; color: #6b7480; }
</style>
</head>
<body>
  <div class="head">
    <h1>&#128202; Andon Tracking Dashboard</h1>
    <div class="actions">
      <span class="updated" id="updated"></span>
      <button class="btn" onclick="load()">Refresh</button>
      <button class="btn primary" onclick="exportCsv()">Export CSV</button>
      <a class="btn" href="sme.html">SME Console</a>
      <a class="btn" href="associate.html">Associate</a>
    </div>
  </div>

  <div class="totals" id="totals"></div>

  <div class="grid">
    <div class="panel">
      <h2>Answers by SME / Expert</h2>
      <table>
        <thead><tr><th>SME login</th><th class="num">Queries answered</th></tr></thead>
        <tbody id="perSme"></tbody>
      </table>
    </div>
    <div class="panel">
      <h2>Queries by Associate</h2>
      <table>
        <thead><tr><th>Associate login</th><th class="num">Queries posted</th></tr></thead>
        <tbody id="perAssoc"></tbody>
      </table>
    </div>
  </div>

  <div class="history">
    <h2>Query History <span class="muted" id="histCount"></span></h2>
    <div class="history-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th><th>Associate</th><th>Comment</th><th>Status</th>
            <th>Claimed by</th><th>Answered by</th><th>Image</th><th>Posted at</th>
          </tr>
        </thead>
        <tbody id="history"></tbody>
      </table>
    </div>
  </div>

<script>
let lastQueries = [];

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(iso){ try { return new Date(iso).toLocaleString(); } catch(e){ return iso; } }

async function load() {
  try {
    const [statsRes, qRes] = await Promise.all([
      fetch('/api/stats'), fetch('/api/queries')
    ]);
    const stats = await statsRes.json();
    const q = await qRes.json();
    lastQueries = q.queries || [];
    renderTotals(stats.totals);
    renderPerSme(stats.per_sme);
    renderPerAssoc(stats.per_associate);
    renderHistory(lastQueries);
    document.getElementById('updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('updated').textContent = 'Server not reachable';
  }
}

function renderTotals(t) {
  t = t || {};
  document.getElementById('totals').innerHTML =
    stat('blue', t.total_queries || 0, 'Total queries') +
    stat('green', t.total_answered || 0, 'Queries answered') +
    stat('orange', t.open || 0, 'Currently open');
}
function stat(cls, n, l) {
  return '<div class="stat ' + cls + '"><div class="n">' + n + '</div><div class="l">' + l + '</div></div>';
}

function renderPerSme(rows) {
  const el = document.getElementById('perSme');
  if (!rows || !rows.length) { el.innerHTML = '<tr><td colspan="2" class="empty">No answers recorded yet.</td></tr>'; return; }
  el.innerHTML = rows.map(r => '<tr><td>' + escapeHtml(r.sme_login) + '</td><td class="num">' + r.answered + '</td></tr>').join('');
}
function renderPerAssoc(rows) {
  const el = document.getElementById('perAssoc');
  if (!rows || !rows.length) { el.innerHTML = '<tr><td colspan="2" class="empty">No queries posted yet.</td></tr>'; return; }
  el.innerHTML = rows.map(r => '<tr><td>' + escapeHtml(r.associate_login) + '</td><td class="num">' + r.posted + '</td></tr>').join('');
}

function renderHistory(rows) {
  document.getElementById('histCount').textContent = rows.length ? '(' + rows.length + ')' : '';
  const el = document.getElementById('history');
  if (!rows.length) { el.innerHTML = '<tr><td colspan="8" class="empty">No queries yet.</td></tr>'; return; }
  el.innerHTML = rows.map(r => {
    const answeredBy = (r.answers && r.answers.length)
      ? r.answers.map(a => escapeHtml(a.sme_login)).join(', ')
      : '<span class="muted">—</span>';
    const imageCell = r.image
      ? '<a href="/api/image?id=' + r.id + '" target="_blank" class="img-link">View image</a>'
      : '<span class="muted">—</span>';
    const claimedBy = r.claimed_by
      ? escapeHtml(r.claimed_by)
      : '<span class="muted">—</span>';
    return '<tr>' +
      '<td>#' + r.id + '</td>' +
      '<td>' + escapeHtml(r.associate_login) + '</td>' +
      '<td>' + escapeHtml(r.comment) + '</td>' +
      '<td><span class="pill ' + r.status + '">' + r.status + '</span></td>' +
      '<td>' + claimedBy + '</td>' +
      '<td class="answers-cell">' + answeredBy + '</td>' +
      '<td>' + imageCell + '</td>' +
      '<td>' + fmt(r.created_at) + '</td>' +
    '</tr>';
  }).join('');
}

function exportCsv() {
  const origin = window.location.origin; // e.g. http://localhost:8900
  const header = ['query_id','associate_login','comment','status','claimed_by','answered_by','answer_texts','image_url','posted_at'];
  const lines = [header.join(',')];
  lastQueries.forEach(r => {
    const answeredBy = (r.answers || []).map(a => a.sme_login).join(' | ');
    const answerTexts = (r.answers || []).map(a => a.response_text).join(' | ');
    // Clickable link that opens the posted image in a browser (blank if no image).
    const imageUrl = r.image ? (origin + '/api/image?id=' + r.id) : '';
    const row = [r.id, r.associate_login, r.comment, r.status, (r.claimed_by || ''), answeredBy, answerTexts, imageUrl, r.created_at]
      .map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"');
    lines.push(row.join(','));
  });
  const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'andon_queries.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

load();
setInterval(load, 5000);
</script>
</body>
</html>
